name: SomniaSkyblock
version: '${version}'
main: dev.somnia.skyblock.SomniaSkyblockPlugin
load: STARTUP
api-version: '26.3'
authors: [somnia]
description: SkyBlock island with a personal Somnia purse
commands:
  register:
    description: Create your account (sets the password that locks your purse)
    usage: /register <password> <password>
    aliases: [reg]
  login:
    description: Log in
    usage: /login <password>
    aliases: [l]
  dev:
    description: Dev mode (dev accounts only, after /login)
    usage: /dev
    aliases: [devmode]
  user:
    description: Back to user mode
    usage: /user
    aliases: [usermode]
  changepassword:
    description: Change your password
    usage: /changepassword <old> <new>
  sb:
    description: SkyBlock menu
    usage: /sb
  island:
    description: Return to your island
    usage: /island
    aliases: [is, home]
  hub:
    description: Go to the hub
    usage: /hub
  visit:
    description: Visit another player's island as a guest
    usage: /visit <player>
  craft:
    description: Compress a resource into an enchanted item
    usage: /craft cobble|oak|void
  deposit:
    description: Show your purse address
    usage: /deposit
  withdraw:
    description: Send STT or the Voidstep Blade in hand from your purse to a main wallet
    usage: /withdraw <amount> <address> | /withdraw blade <address>
  exportkey:
    description: Get the private key of your game wallet (needs your password; every later write is server-signed)
    usage: /exportkey confirm <password>
  deposit-nft:
    description: Bring a Voidstep Blade back from your game wallet into the game
    usage: /deposit-nft <serial>
  trade:
    description: Trades are coming SOON.
    usage: /trade <player>
  bazaar:
    description: Bazaar (STT market on Somnia)
    usage: /bz [sell|order|cancel|orders|claim] ...
    aliases: [bz]
  auction:
    description: Auction House (STT escrow on Somnia)
    usage: /ah [sell <start stt> [minutes]]
    aliases: [ah]
  arena:
    description: Colosseum arena waves
    usage: /arena [leave]
  stats:
    description: Your combat stats
    usage: /stats
  relic:
    description: Relic Pool bank
    usage: /relic
  bank:
    description: Open the Bank (anywhere with the Booster buff)
    usage: /bank
  cookie:
    description: Booster - buy with SOMI, buff applies at once
    usage: /cookie [buy|address]
    aliases: [boostercookie, booster]
  quest:
    description: Hub quest path
    usage: /quest
    aliases: [quests]
  sbmenu:
    description: Open the SkyBlock Menu
    usage: /sbmenu
    aliases: [menu, sbm]
  skills:
    description: Your skills
    usage: /skills
  collection:
    description: Your collections
    usage: /collection
    aliases: [collections]
  levels:
    description: SkyBlock Leveling
    usage: /levels
    aliases: [sblevels]
  calendar:
    description: SkyBlock calendar and events
    usage: /calendar
  warp:
    description: Fast travel
    usage: /warp
  sbadmin:
    description: Admin - clean stop, save-off/save-on for backups, status
    usage: /sbadmin <stop|save-off|save-on|save|status|unregister <name>|deploy-skills2|reset-skills <name>>
    permission: somnia.admin
  minion:
    description: Place or list your minions
    usage: /minion [place]
    aliases: [minions]

  coop:
    description: Co-op - invite players to share your island and collections
    usage: /coop [<player>|accept|deny|leave|kick <player>|view|chat <msg>|clear]
    aliases: [coopview]
  coopadd:
    description: Invite a player to your co-op
    usage: /coopadd <player>
  coopkick:
    description: Vote to kick a co-op member
    usage: /coopkick <player>
  coopchat:
    description: Chat with your co-op
    usage: /coopchat <message>
    aliases: [cchat, cc]
  coopclear:
    description: Clear your pending co-op invites
    usage: /coopclear
  coopsalvage:
    description: Salvage a former member's items (SOON)
    usage: /coopsalvage

permissions:
  somnia.admin:
    description: /sbadmin (stop, save-off, save-on)
    default: op
