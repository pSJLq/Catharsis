batch-seconds: 4
chain:
  enabled: true
  rpc: "https://api.infra.testnet.somnia.network"
  # Tried in order when the main RPC fails or is rate-limited (all must serve chain id 50312).
  rpc-fallbacks:
    - "https://dream-rpc.somnia.network"
    - "https://rpc.ankr.com/somnia_testnet"
    - "https://50312.rpc.thirdweb.com"
  chain-id: 50312
  old-realm-contract: "0xEE46A54C65561Ec4F1589Db5a612c30b8fEcC59d"
  keys-contract: "0x75B33d1FFd2cb793Cca8280B8E80762339927B3b"
  profile-contract: "0xaCced5efB1762DfAF2587723c9dC07256fa4eb60"
  hold-contract: "0x5F802b43A38f5460BAB78f4793601c36eEF7ba7f"
  gear-contract: "0x67e01A054Dbe23d45695F737a77768d4a842c4b0"
  word-contract: "0x4611a06Fc96f7dF31D5363c1Cb6D300FA691D405"
  aotv-contract: "0x248a3A61F1227774D4fCeA15e1725CA95dAbF632"
  realm-contract: "0xE124dD8443c1bF2045E1376f5fe3E277Dcd31c8a"
  bin-contract: "0x420Dc7D312719C041bb3fedc6e83Ce8dFd7789A3"
  skills-contract: "0x891361C58ab3b81c2F6469a9F61011ca6fa4E72d"
  skills-version: 3  gas-limit: 8000000
  max-fee-gwei: 20         # cap; the fee itself follows eth_gasPrice (+ a safety margin)

# Login with a limbo (Auth). Purse keys are sealed with the player's password (Argon2id + AES-256-GCM).
auth:
  session-hours: 0         # 0 = /login on every join (sessions by name + IP only once a proxy passes the real IP)
  max-accounts-per-ip: 2   # new purses registered per IP (0 = no limit)
  timeout-seconds: 60      # kick if not logged in by then
  max-attempts: 5          # wrong passwords before a lockout and kick
  lockout-minutes: 15
  min-password-length: 8
  argon2:
    memory-kb: 65536
    iterations: 3
    lanes: 1

# Accounts that may use /dev (op + admin for one session, only after /login).
# Leave empty in this repository. Set names on your own server.
dev-accounts: []
